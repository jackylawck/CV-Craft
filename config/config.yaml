app:
  title: "CV-Craft 排歷匠"
  subtitle: "Instant, safe & offline CV formatting tool | Word & PDF Export"
  default_font: "Calibri"
  default_font_size: 11
  primary_color: "#1B365D"

headers:
  - "RESUME"
  - "CURRICULUM VITAE"
  - "PERSONAL INFORMATION"
  - "PERSONAL DETAILS"
  - "EDUCATIONAL QUALIFICATIONS"
  - "EDUCATION"
  - "ACADEMIC QUALIFICATIONS"
  - "ACADEMIC AWARDS"
  - "AWARDS"
  - "HONORS AND AWARDS"
  - "HONORS & AWARDS"
  - "CERTIFICATES & SKILLS"
  - "OTHER SKILLS"
  - "SKILLS"
  - "SKILLS & CERTIFICATES"
  - "CERTIFICATIONS"
  - "WORK EXPERIENCE"
  - "WORKING EXPERIENCE"
  - "CAREER & INTERNSHIP"
  - "EMPLOYMENT HISTORY"
  - "CAREER HISTORY"
  - "PROFESSIONAL EXPERIENCE"
  - "PROJECT"
  - "PROJECTS"
  - "RESEARCH EXPERIENCE"
  - "EXTRACURRICULAR ACTIVITIES"
  - "JOB APPLICATION DETAILS"
  - "APPLICATION DETAILS"
  - "CANDIDATE’S INFORMATION"
  - "CANDIDATE INFORMATION"
  - "履歷"
  - "個人資料"
  - "個人信息"
  - "聯絡資料"
  - "教育背景"
  - "教育程度"
  - "學歷背景"
  - "學歷資格"
  - "工作經驗"
  - "工作履歷"
  - "工作經歷"
  - "職業經歷"
  - "項目經驗"
  - "專案經歷"
  - "課外活動"
  - "獲獎紀錄"
  - "個人獎項"
  - "技能與證照"
  - "專業技能"
  - "語言能力"
  - "應徵資料"
  - "求職意向"

ocr_replacements:
  - pattern: "\\bpply\\b"
    replacement: "Apply"
  - pattern: "\\b(\\$\\d+)\\s+(\\d+)\\b"
    replacement: "\\1\\2"
  - pattern: "\\b(C|c)\\s+ompleted\\b"
    replacement: "Completed"
  - pattern: "\\bYa\\s+n\\b"
    replacement: "Yan"

page_no_patterns:
  - "^\\d+\\s*\\|\\s*P\\s*a\\s*g\\s*e$"
  - "^Page\\s+\\d+\\s+of\\s+\\d+$"
  - "^\\d+\\s*/\\s*\\d+$"

# 🆕 雜訊過濾清單
ignore_patterns:
  - "^STRICTLY CONFIDENTIAL$"
  - "^CONFIDENTIAL$"
  - "^DRAFT$"
  - "^PRIVATE & CONFIDENTIAL$"
