app:
  title: "CV-Craft 排歷匠"
  subtitle: "Instant, safe & offline CV formatting tool"
  default_font: "Calibri"
  default_font_size: 11
  primary_color: "#1B365D"

headers:
  - "RESUME"
  - "CURRICULUM VITAE"
  - "PERSONAL DATA"
  - "PERSONAL DETAILS"
  - "PERSONAL INFORMATION"
  - "ACADEMIC ATTAINMENT"
  - "EDUCATIONAL QUALIFICATIONS"
  - "EDUCATION"
  - "AWARDS"
  - "WORK EXPERIENCE"
  - "WORKING EXPERIENCE"
  - "CAREER HISTORY"
  - "SKILLS"
  - "DATE AVAILABLE"
  - "履歷"
  - "個人資料"
  - "工作經驗"

ocr_replacements:
  - pattern: "\\bpply\\b"
    replacement: "Apply"

page_no_patterns:
  - "^\\d+$"
  - "^Page\\s+\\d+\\s+of\\s+\\d+$"

ignore_patterns:
  - "^CONFIDENTIAL$"
